<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iyBarTec</title>
<style>
  :root { --text:#2b2622; --grau:#6b625a; --akzent:#e8892a; --bg:#fffcf4; --linie:#e6dcc8; }
  @media (prefers-color-scheme: dark) { :root { --text:#f2ede6; --grau:#b3aaa0; --bg:#1c1a18; --linie:#3a352f; } }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width:720px; margin:0 auto; padding:48px 16px 64px; }
  h1 { font-size:34px; margin:0 0 8px; } h2 { font-size:22px; margin:40px 0 8px; }
  .klein { color:var(--grau); font-size:15px; } a { color:var(--akzent); }
  .karte { border:1px solid var(--linie); border-radius:16px; padding:20px; margin-top:12px; }
  footer { margin-top:56px; }
  footer a { margin-right:16px; }
  html { scroll-padding-top:80px; }
  body { padding-top:62px; }
  .laden { position:fixed; top:0; left:0; right:0; z-index:10; background:var(--bg); border-bottom:1px solid var(--linie); }
  .laden-innen { max-width:720px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; }
  .laden img { width:40px; height:40px; border-radius:9px; flex:none; }
  .laden-text { flex:1; min-width:0; line-height:1.25; }
  .laden-text strong { display:block; }
  .laden-text span { display:block; color:var(--grau); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .laden-knopf { flex:none; background:var(--akzent); color:#1c1a18; font-weight:600; font-size:15px; padding:8px 16px; border-radius:999px; text-decoration:none; white-space:nowrap; }
</style>
</head>
<body>
<div class="laden"><div class="laden-innen">
  <img src="calcuroll/symbol.png" alt="Calcuroll">
  <div class="laden-text"><strong>Calcuroll</strong><span>Für iPhone, iPad, Mac und Apple Watch</span></div>
  <span class="laden-knopf" id="appstore">Bald im App Store</span>
</div></div>
<main>
<h1>iyBarTec</h1>

</body>
</html>
